[package]
name = "buffex"
version = "0.3.0"
edition = "2024"

authors = ["lino <lino_snsalias@outlook.com>"]
description = "BUFFer EXtensions: ring buffer and buffer chaining."
repository = "https://github.com/ljsnogard/buffex"
keywords = ["buffer", "io"]
categories = ["algorithms", "no-std"]
license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
# -- core (async-runtime agnostic, no_std) --
atomic_sync = { path = "../atomic_sync" }
# `segm-tests` 仅在测试中启用 abs_buff 的泛型段测试模块（编译时无运行时开销）。
abs_buff = { path = "../abs_buff", features = ["segm-tests"] }
mm_ptr = { git = "https://gitee.com/lino_snsalias/mm_ptr.git", branch = "dev/0.1.3" }


[dev-dependencies]
env_logger = { workspace = true }
log = { workspace = true }
rand = { version = "0.8.*" }
atomic_sync = { path = "../atomic_sync" }
tokio = { version = "1", features = ["full"] }
futures-lite = { workspace = true }
